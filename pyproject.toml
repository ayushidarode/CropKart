[project]
name = "cropkart"
version = "0.1.0"
description = "CropKart - Agricultural Marketplace & CropSathi AI Service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.0.54",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
