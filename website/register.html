<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CropKart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container navbar-content">
            <div class="logo">🌾 CropKart</div>
            <div class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="marketplace.html">Marketplace</a>
            </div>
            <div class="auth-menu" id="authMenu">
                <a href="login.html" class="btn btn-primary">Login</a>
            </div>
        </div>
    </nav>

    <main style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 200px); padding: 2rem 0;">
        <div class="container" style="max-width: 500px;">
            <div class="card">
                <div class="card-body">
                    <h2 style="text-align: center; margin-bottom: 2rem;">Create Your CropKart Account</h2>

                    <form id="registerForm">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="name" required>
                        </div>

                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="email" required>
                        </div>

                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="password" required>
                        </div>

                        <div class="form-group">
                            <label>Phone</label>
                            <input type="tel" id="phone" required>
                        </div>

                        <div class="form-group">
                            <label>Account Type</label>
                            <select id="role" required>
                                <option value="">-- Select Account Type --</option>
                                <option value="farmer">🌾 Farmer</option>
                                <option value="buyer">🛒 Buyer</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Location (City/Region)</label>
                            <input type="text" id="location" required>
                        </div>

                        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem; font-size: 1.1rem; padding: 0.75rem;">
                            Create Account
                        </button>
                    </form>

                    <p style="text-align: center; margin-top: 1.5rem; color: var(--secondary-gray);">
                        Already have an account? 
                        <a href="login.html" style="color: var(--primary-green); text-decoration: none; font-weight: 500;">Login</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 CropKart. All rights reserved.</p>
        </div>
    </footer>

    <script src="app.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const phone = document.getElementById('phone').value;
            const role = document.getElementById('role').value;
            const location = document.getElementById('location').value;

            try {
                const response = await apiCall('POST', '/auth/register', {
                    name,
                    email,
                    password,
                    phone,
                    role,
                    location
                });
                localStorage.setItem('token', response.token);
                localStorage.setItem('user', JSON.stringify(response.user));
                showAlert('Account created successfully!', 'success');
                setTimeout(() => {
                    location.href = response.user.role === 'farmer' ? 'farmer-dashboard.html' : 'buyer-dashboard.html';
                }, 1000);
            } catch (error) {
                showAlert(error.message, 'error');
            }
        });
    </script>
</body>
</html>
