<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CropKart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container navbar-content">
            <div class="logo">🌾 CropKart</div>
            <div class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="marketplace.html">Marketplace</a>
            </div>
            <div class="auth-menu" id="authMenu">
                <a href="register.html" class="btn btn-primary">Sign Up</a>
            </div>
        </div>
    </nav>

    <main style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 200px);">
        <div class="container" style="max-width: 400px;">
            <div class="card">
                <div class="card-body">
                    <h2 style="text-align: center; margin-bottom: 2rem;">Login to CropKart</h2>

                    <form id="loginForm">
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="email" required>
                        </div>

                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="password" required>
                        </div>

                        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem; font-size: 1.1rem; padding: 0.75rem;">
                            Login
                        </button>
                    </form>

                    <p style="text-align: center; margin-top: 1.5rem; color: var(--secondary-gray);">
                        Don't have an account? 
                        <a href="register.html" style="color: var(--primary-green); text-decoration: none; font-weight: 500;">Sign up</a>
                    </p>
                </div>
            </div>

            <div class="card" style="margin-top: 2rem;">
                <div class="card-body">
                    <h4>Demo Credentials</h4>
                    <p style="margin-bottom: 1rem;"><strong>Farmer:</strong><br>Email: ramesh@example.com<br>Password: password123</p>
                    <p><strong>Buyer:</strong><br>Email: buyer@example.com<br>Password: password123</p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 CropKart. All rights reserved.</p>
        </div>
    </footer>

    <script src="app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await apiCall('POST', '/auth/login', { email, password });
                localStorage.setItem('token', response.token);
                localStorage.setItem('user', JSON.stringify(response.user));
                showAlert('Login successful!', 'success');
                setTimeout(() => {
                    location.href = response.user.role === 'farmer' ? 'farmer-dashboard.html' : 'buyer-dashboard.html';
                }, 1000);
            } catch (error) {
                showAlert(error.message, 'error');
            }
        });
    </script>
</body>
</html>
