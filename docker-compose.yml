services:
  postgres:
    image: postgres:16-alpine
    container_name: cropkart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cropkart
      POSTGRES_USER: cropkart
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cropkart123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cropkart -d cropkart"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cropkart-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      LANGFLOW_URL: ${LANGFLOW_DOCKER_URL:-http://host.docker.internal:7860}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  langflow:
    image: langflowai/langflow:latest
    container_name: cropkart-langflow
    restart: unless-stopped
    environment:
      LANGFLOW_HOST: 0.0.0.0
      LANGFLOW_PORT: 7860
      LANGFLOW_SUPERUSER: admin
      LANGFLOW_SUPERUSER_PASSWORD: admin123
      LANGFLOW_AUTO_LOGIN: "false"
      LANGFLOW_DATABASE_URL: sqlite:////app/data/langflow.db
      LANGFLOW_API_KEY: ${LANGFLOW_API_KEY:-sk-FTo7wTXICwi1DSB91FTTNHQjGixFnnInbQn6O8uLR5Q}
    ports:
      - "7860:7860"
    volumes:
      - cropkart-langflow-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
    name: cropkart_postgres_data
  cropkart-langflow-data:
    name: cropkart-langflow-data
    external: true
